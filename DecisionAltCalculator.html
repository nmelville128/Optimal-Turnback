climb_gradients = (climb_rates * 60) / (v_climb * 6076)

def AeroForcesSetup2(v_stall, v_ldmax, ld_max, weight, S=1.0, rho=1.0):
    # lift calculation
    cl_stall = 2 * weight / (rho * S * v_stall**2)

    cl0 = 0
    cl1 = cl_stall

    # Drag Calculation
    cl_ldmax = 2 * weight / (rho * S * v_ldmax**2)

    a_ldmax = (cl_ldmax - cl0) / cl1

    # k calculation - carefully translate the Matlab expression
    k_denominator = (cl1**3 * a_ldmax**2 + 2 * cl0 * cl1**2 * a_ldmax + cl0**2 * cl1 + cl1 * cl_ldmax**2)
    # Ensure k_denominator is not zero to avoid division by zero
    if k_denominator == 0:
        # Handle this case, e.g., by returning default values or raising an error
        # For now, let's assume valid inputs prevent this.
        pass # Or set k to a safe value like 0 if division by zero is possible and acceptable

    k = (cl1 * cl_ldmax) / (ld_max * k_denominator)

    Cd0_base = (cl_ldmax / ld_max) - k * cl_ldmax**2
    cd0 = Cd0_base + k * cl0**2
    cd1 = 2 * k * cl0 * cl1
    cd2 = k * cl1**2

    return cl0, cl1, cd0, cd1, cd2
    
    import numpy as np

def sind(x): return np.sin(np.deg2rad(x))
def cosd(x): return np.cos(np.deg2rad(x))

def myObjective(Z, P):
    # cost = Z[len(Z)-9] + P['ld_max'] * Z[len(Z)-7] # Use this for TCCC (Matlab Z(end-8) -> Python Z[len(Z)-9], Z(end-6) -> Z[len(Z)-7])
    cost = -Z[1] # Matlab Z(2) -> Python Z[1] for decision altitude
    return cost

def myConstraint(Z_flat_full, P):
    # Unpack parameters
    N = P['N']
    Nx = P['Nx']
    Nv = P['Nv']
    No = P['No']
    Nr = P['Nr']
    Tr = P['Tr']
    dt_P = P['dt'] # Renamed to avoid conflict with local 'dt' calculation
    wind = P['wind']
    rho = P['rho']
    g = P['g']
    cl0, cl1 = P['cl0'], P['cl1']
    cd0, cd1, cd2 = P['cd0'], P['cd1'], P['cd2']
    S = P['S']
    m = P['m']
    # vf = P['vf'] # Not used in the provided Matlab code for this section
    # s_max = P['s_max'] # Not used in the provided Matlab code for this section
    # v_stall = P['v_stall'] # Not used in the provided Matlab code for this section

    # Constants
    kn_fps = 1.6878
    fps_kn = 1.0 / kn_fps

    # Intermediate: Matlab Z(1) is Z_flat_full[0], Z(No+1:end) is Z_flat_full[No:]
    s = Z_flat_full[0]
    Z_states_flat = Z_flat_full[No:] # This is the flattened state vector from Z_opt

    # Extract state and control variables from the flattened state vector
    # Matlab: Z(idx:Nv:end,1) where Z is (Nv, N) matrix or a flattened array in column-major
    # Python: Z_states_flat[idx-1::Nv] where idx is 1-based index from Matlab state definition
    x = Z_states_flat[0::Nv]
    y = Z_states_flat[1::Nv]
    z = Z_states_flat[2::Nv] # Note: Matlab uses z for negative altitude, but the variable is named 'z'
    vx = Z_states_flat[3::Nv]
    vy = Z_states_flat[4::Nv]
    vz = Z_states_flat[5::Nv]

    bank = Z_states_flat[6::Nv]
    aoa = Z_states_flat[7::Nv]
    thrust = Z_states_flat[8::Nv]

    # Calculate intermediate values for dynamics
    v = np.sqrt(vx**2 + vy**2 + vz**2 + 1e-6) # Added small epsilon to prevent sqrt of zero
    cl = cl0 + cl1 * aoa
    cd = cd0 + cd1 * aoa + cd2 * aoa**2
    L = 0.5 * rho * v**2 * cl * S
    D = 0.5 * rho * v**2 * cd * S

    # State derivatives (dx, dy, dz)
    dx = kn_fps * (vx + wind[0]) # Matlab wind(1) -> Python wind[0]
    dy = kn_fps * (vy + wind[1])
    dz = kn_fps * (vz + wind[2])

    # Body frame axial thrust
    ax_thrust_b = (1.0 / m) * thrust * g

    # Wind frame accelerations
    ax_w = cosd(20 * aoa - 5) * ax_thrust_b - (1.0 / m) * D * g
    az_w = -sind(20 * aoa - 5) * ax_thrust_b - (1.0 / m) * L * g

    # Heading and Climb Angle in degrees
    heading = np.rad2deg(np.arctan2(vy, vx + 1e-6)) # Added small epsilon for safety
    climb_angle = np.rad2deg(np.arctan2(vz, np.sqrt(vx**2 + vy**2) + 1e-6)) # Added small epsilon for safety

    # Inertial frame accelerations (ax, ay, az)
    az_inertial = fps_kn * (sind(climb_angle) * ax_w + cosd(climb_angle) * cosd(bank) * az_w + g)
    ay_inertial = fps_kn * (sind(heading) * cosd(climb_angle) * ax_w + (-sind(heading) * sind(climb_angle) * cosd(bank) + cosd(heading) * sind(bank)) * az_w)
    ax_inertial = fps_kn * (cosd(heading) * cosd(climb_angle) * ax_w + (-cosd(heading) * sind(climb_angle) * cosd(bank) - sind(heading) * sind(bank)) * az_w)

    # Reshaping Xdot and X (as in Matlab's column-major flattening)
    X_flat = np.vstack([x, y, z, vx, vy, vz]).reshape((N * Nx), order='F') # Flatten to 1D, column-major
    Xdot_flat = np.vstack([dx, dy, dz, ax_inertial, ay_inertial, az_inertial]).reshape((N * Nx), order='F') # Flatten to 1D, column-major

    # Equality Constraints (ceq)
    # Initialize ceq with the s*dt_P part
    dt = 1/(N-Nr-1)
    dt_P = dt

    ceq = X_flat[Nx:] - X_flat[:-Nx] - 0.5 * s * dt_P * (Xdot_flat[Nx:] + Xdot_flat[:-Nx])

    # Overwrite the initial part of ceq with the Tr/Nr dt if Nr > 0
    num_elements_to_overwrite = Nx * Nr - Nx

    if num_elements_to_overwrite > 0: # Only perform overwrite if there are positive elements
        # Matlab: ceq(1:Nx*Nr-Nx) = X(Nx + 1:Nx*Nr) - X(1:Nx*Nr - Nx) - 0.5*(Tr/Nr)*Xdot(Nx + 1:Nx*Nr) - 0.5*(Tr/Nr)*Xdot(1:Nx*Nr - Nx);

        ceq_overwrite_part = X_flat[Nx:Nx*Nr] - X_flat[:Nx*Nr-Nx] - \
                             0.5 * (Tr/Nr) * (Xdot_flat[Nx:Nx*Nr] + Xdot_flat[:Nx*Nr-Nx])

        ceq[:Nx*Nr-Nx] = ceq_overwrite_part


    # Inequality Constraints (cineq)
    cineq = [] # No explicit inequality constraints provided in the Matlab code

    return cineq, ceq

Ni = N + 3

Aineq[Ni - 3, -6] = 1

bineq[Ni - 2] = runways
Aineq[Ni - 1, -9] = -1
bineq[Ni - 1] = -landing_distance

# Equality Constraints setup
Ne = 9
Aeq = np.zeros((Ne + 2 * Nr, N * Nv + No))
Aeq[0, 1] = 1 / climb_gradients
Aeq[0, No] = 1
Aeq[1, No + 1] = 1

Aeq[5, No + 5] = 1

for i in range(Nr):
    Aeq[Ne + 2 * i, No + (i+1) * Nv - 3] = 1
    Aeq[Ne + 2 * i + 1, No + (i+1) * Nv - 2] = 1

Aeq[6, -8] = 1
Aeq[7, -5] = 1
Aeq[8, -4] = 1

beq = np.zeros(Ne + 2 * Nr)
beq[0] = takeoff_distance
beq[3] = v_climb * np.cos(np.arctan(climb_gradients))
beq[4] = -1
beq[5] = -v_climb * np.sin(np.arctan(climb_gradients))
for i in range(Nr):
    beq[Ne + 2 * i + 1] = a_climb

# Bounds
low_b = [20, -5000] + [-100000, -100000, -100000, -1000, -1000, -1000, -bank_max, 0.0, 0] * N
upp_b = [s_max, 0] + [100000, 100000, 100000, 1000, 1000, 1000, bank_max, aoa_max, 0] * N
bounds = list(zip(low_b, upp_b))

# Calculate aerodynamic coefficients for the dictionary
cl0, cl1, cd0, cd1, cd2 = AeroForcesSetup2(

# Time step calculation

dt_val = 1 / (N - Nr - 1)

# Define constraints for scipy
def linear_eq_cons(Z): return Aeq @ Z - beq

cons = [
